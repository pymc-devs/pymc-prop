[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymc-pro"
version = "0.0.0"
description = "Predictively Oriented posteriors for PyMC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "PyMC Developers" }
]
dependencies = [
  "numpy",
  "pymc",
  "pytensor",
  "arviz",
  "xarray",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymc_prop*"]
